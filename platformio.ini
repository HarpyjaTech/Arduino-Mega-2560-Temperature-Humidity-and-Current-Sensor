; Alternativa à Arduino IDE, com as versões das bibliotecas fixadas.
;   Compilar:        pio run
;   Gravar na placa: pio run -t upload
;   Monitor serial:  pio device monitor
[platformio]
src_dir = firmware
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/UIPEthernet/UIPEthernet.git#v2.0.12
    https://github.com/adafruit/DHT-sensor-library.git#1.4.6
    https://github.com/adafruit/Adafruit_Sensor.git#1.1.14
    https://github.com/arduino-libraries/NTPClient.git#3.2.1
    https://github.com/PaulStoffregen/Time.git#v1.6.1
    https://github.com/johnrickman/LiquidCrystal_I2C.git#1.1.2
    https://github.com/knolleary/pubsubclient.git#v2.8
    https://github.com/bblanchon/ArduinoJson.git#v7.4.2
    https://github.com/openenergymonitor/EmonLib.git#1.1.0
