; Alternativa à Arduino IDE, com as versões da plataforma e das bibliotecas fixadas.
;   Compilar:          pio run
;   Gravar via USB:    pio run -t upload
;   Gravar via Wi-Fi:  pio run -e ota -t upload   (ajuste upload_port e a senha abaixo)
;   Monitor serial:    pio device monitor
[platformio]
src_dir = firmware
default_envs = esp32

[env:esp32]
; pioarduino = Arduino-ESP32 3.3.2 (a plataforma oficial "espressif32" ainda usa o core 2.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/adafruit/DHT-sensor-library.git#1.4.6
    https://github.com/adafruit/Adafruit_Sensor.git#1.1.14
    https://github.com/knolleary/pubsubclient.git#v2.8
    https://github.com/bblanchon/ArduinoJson.git#v7.4.2
    https://github.com/adafruit/Adafruit_SSD1306.git#2.5.17
    https://github.com/adafruit/Adafruit-GFX-Library.git#1.12.6
    https://github.com/adafruit/Adafruit_BusIO.git#1.17.4
    ; Só necessária com LCD_ENABLED 1:
    ; https://github.com/johnrickman/LiquidCrystal_I2C.git#1.1.2

[env:ota]
extends = env:esp32
upload_protocol = espota
upload_port = monitor-clima-ufc.local
upload_flags = --auth=troque_esta_senha
