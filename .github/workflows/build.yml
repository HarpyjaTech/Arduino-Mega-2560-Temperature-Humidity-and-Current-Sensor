name: Compilar firmware

on:
  push:
  pull_request:

jobs:
  arduino-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Instalar core ESP32
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.2

      - name: Instalar bibliotecas
        run: |
          arduino-cli lib install \
            "DHT sensor library@1.4.6" \
            "Adafruit Unified Sensor@1.1.14" \
            "PubSubClient@2.8" \
            "ArduinoJson@7.4.2" \
            "Adafruit SSD1306@2.5.17" \
            "Adafruit GFX Library@1.12.6" \
            "Adafruit BusIO@1.17.4"

      # Sem firmware/secrets.h o sketch usa as credenciais de exemplo (secrets.example.h)
      - name: Compilar para ESP32 (DOIT DevKit V1 / ideaspark ESP32 OLED)
        run: arduino-cli compile --fqbn esp32:esp32:esp32doit-devkit-v1 --warnings default firmware
